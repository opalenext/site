[build]
  publish = "."

# Fonctions serverless (API du diagnostic). Variables d'environnement à définir dans Netlify :
# GOOGLE_SHEET_ID, GOOGLE_SERVICE_ACCOUNT_EMAIL et GOOGLE_PRIVATE_KEY.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Le code et les fichiers techniques du dépôt ne doivent pas être servis comme pages.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
